name: CI

run-name: publication-${{ inputs.cycle || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: Synthetic publication cycle identifier
        required: true
        type: string
      expected_sha:
        description: Reviewed exact commit SHA
        required: true
        type: string
      mode:
        description: Explicit private JIT or public hosted route
        required: true
        type: choice
        options: [private, public]
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    if: ${{ github.event_name != 'workflow_dispatch' && (!github.event.repository.private || (github.repository == 'gernalix/adb-device-keeper-clean' && vars.CI_JIT_HEAD_SHA != '' && github.sha == vars.CI_JIT_HEAD_SHA && startsWith(vars.CI_JIT_LABEL, 'p201-r0096-'))) || github.event_name == 'workflow_dispatch' && github.sha == inputs.expected_sha && ((inputs.mode == 'public' && !github.event.repository.private) || (inputs.mode == 'private' && github.event.repository.private && (github.repository == 'gernalix/adb-device-keeper-clean' && vars.CI_JIT_HEAD_SHA != '' && github.sha == vars.CI_JIT_HEAD_SHA && startsWith(vars.CI_JIT_LABEL, 'p201-r0096-')))) }}
    runs-on: ${{ github.event.repository.private && (github.repository == 'gernalix/adb-device-keeper-clean' && vars.CI_JIT_HEAD_SHA != '' && github.sha == vars.CI_JIT_HEAD_SHA && startsWith(vars.CI_JIT_LABEL, 'p201-r0096-')) && vars.CI_JIT_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify keeper
        run: |
          bash tests/test_keeper.sh
          python3 tests/test_ci_routing.py
